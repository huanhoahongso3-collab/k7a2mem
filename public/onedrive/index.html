<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OneDrive</title>
<link rel="stylesheet" href="/onedrive/styles.css" />
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="/" class="viewer-icon-btn topbar-icon-btn" id="back-home" aria-label="Về trang chủ" title="Về trang chủ">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </a>
    <div class="topbar-text">
      <span class="material-title">OneDrive</span>
      <span id="item-count" class="topbar-subtitle"></span>
    </div>
    <div class="topbar-actions">
      <button id="lang-toggle" class="viewer-icon-btn topbar-icon-btn" title="Change language / Đổi ngôn ngữ">VI</button>
      <button id="theme-toggle" class="viewer-icon-btn topbar-icon-btn" aria-label="Đổi giao diện sáng/tối" title="Đổi giao diện sáng/tối">
        <svg id="theme-icon-dark" viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 01-4.4 2.26 5.403 5.403 0 01-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
        <svg id="theme-icon-light" viewBox="0 0 24 24" width="22" height="22" hidden><path fill="currentColor" d="M12 7a5 5 0 100 10 5 5 0 000-10zM2 13h2v-2H2v2zm18 0h2v-2h-2v2zm-9-9h2V2h-2v2zm0 18h2v-2h-2v2zM4.93 4.93l1.42 1.42 1.41-1.41-1.41-1.42-1.42 1.41zm12.32 12.32l1.41 1.41 1.42-1.41-1.42-1.42-1.41 1.42zM4.93 19.07l1.42-1.41-1.41-1.42-1.42 1.42 1.41 1.41zM17.25 6.35l1.42-1.42-1.42-1.41-1.41 1.41 1.41 1.42z"/></svg>
      </button>
    </div>
  </div>
  <nav id="breadcrumb" class="breadcrumb"></nav>
</header>

<main id="content">
  <div id="loading" class="loading-state">
    <div class="loader" aria-hidden="true"></div>
    <p>Đang tải…</p>
  </div>
  <div id="grid" class="grid" hidden></div>
  <div id="empty" class="empty-state" hidden>
    <p>Thư mục này trống.</p>
  </div>
</main>

<div id="viewer" class="viewer" hidden>
  <div class="viewer-backdrop" data-close></div>
  <div class="viewer-content">
    <div class="viewer-appbar">
      <button class="viewer-icon-btn" data-close aria-label="Đóng">
        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
      <span id="viewer-name" class="viewer-name"></span>
    </div>

    <div class="viewer-stage">
      <button class="viewer-btn viewer-prev" id="viewer-prev" aria-label="Trước">
        <svg viewBox="0 0 24 24" width="28" height="28"><path fill="currentColor" d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      </button>
      <img id="viewer-img" alt="" hidden />
      <video id="viewer-video" controls hidden></video>
      <button class="viewer-btn viewer-next" id="viewer-next" aria-label="Tiếp theo">
        <svg viewBox="0 0 24 24" width="28" height="28"><path fill="currentColor" d="M8.59 16.59L10 18l6-6-6-6-1.41 1.41L13.17 12z"/></svg>
      </button>
    </div>

    <div class="viewer-toolbar">
      <button class="toolbar-btn" id="viewer-download">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>
        <span>Tải xuống</span>
      </button>
    </div>
  </div>
</div>

<div id="snackbar" class="snackbar" role="status" aria-live="polite"></div>

<script src="/onedrive/app.js"></script>
</body>
</html>
